services:
  - type: web
    name: satyam-video-share
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://flddnnyxlyhuorjimsrv.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: videos
