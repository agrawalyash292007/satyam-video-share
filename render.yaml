services:
  - type: web
    name: satyam-video-share
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: OWNER_KEY
        sync: false
    disk:
      name: video-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
